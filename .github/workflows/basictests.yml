name: Lab 9 basic tests

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  lab9-basic-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Run and verify output
        shell: bash
        run: |
          check_output() {
            local actual
            actual=$(bash validate-data.sh "$1" "$2")
            echo "Script output was: $actual"

            if [[ "$actual" != "$3" ]]; then
              echo "Expected: $3"
              return 1
            fi

            echo "Test Passed!"
          }

          check_output "Alex Montgomery" "0123456789" PASS
          check_output "Alex Montgomery" "01234567890" FAIL
          check_output "Jamie Montgomery" "0123456789" FAIL
